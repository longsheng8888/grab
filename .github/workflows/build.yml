name: Build Tweak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & ldid
        run: |
          brew install ldid
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS

      - name: Download SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip sdks.zip
          mv sdks-master/*.sdk .
          rm -rf sdks-master sdks.zip

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:/opt/homebrew/bin:/usr/local/bin:$PATH
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          make clean || true
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: grab-deb
          path: packages/*.deb
